          <rect x="3" y="0" width="114" height="110" rx="30" fill="#030303" stroke="url(#edge)" stroke-width="2"/>
          <rect x="9" y="7" width="102" height="96" rx="24" fill="none" stroke="url(#inner)" stroke-width="1.2"/>
          <path d="M26 16 Q60 6 94 16" stroke="#fff" stroke-opacity=".22" stroke-width="3" stroke-linecap="round" fill="none"/>
          <text x="61.5" y="56" text-anchor="middle" dominant-baseline="central" class="letter">Z</text>
