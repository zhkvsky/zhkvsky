<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Hello, I'm ZHKVSKY — Backend Developer · Go · REST APIs">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d8ff58" stop-opacity=".14"/>
      <stop offset="1" stop-color="#d8ff58" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232323"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a9a9a"/><stop offset=".35" stop-color="#3b3b3b"/>
      <stop offset=".7" stop-color="#262626"/><stop offset="1" stop-color="#6b6b6b"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".12"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="7"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <style>
    text{font-family:"Inter Tight",Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .letter{font-size:56px;font-weight:700;fill:#fff}
    .greet{font-size:30px;fill:#f2f2f2;letter-spacing:-.5px;opacity:0;animation:fade .9s ease-out .1s forwards}
    .glow{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}
    .fall,.press,.shadow{transform-box:fill-box;transform-origin:center}
    .fall{opacity:0;animation:fall .9s cubic-bezier(.16,1,.3,1) both}
    .press{animation:press 5.5s ease-in-out infinite}
    .shadow{opacity:0;animation:fade .9s ease-out both}
    .f0{animation-delay:0.15s}.p0{animation-delay:2.60s}.s0{animation-delay:0.15s}
.f1{animation-delay:0.24s}.p1{animation-delay:2.73s}.s1{animation-delay:0.24s}
.f2{animation-delay:0.33s}.p2{animation-delay:2.86s}.s2{animation-delay:0.33s}
.f3{animation-delay:0.42s}.p3{animation-delay:2.99s}.s3{animation-delay:0.42s}
.f4{animation-delay:0.51s}.p4{animation-delay:3.12s}.s4{animation-delay:0.51s}
.f5{animation-delay:0.60s}.p5{animation-delay:3.25s}.s5{animation-delay:0.60s}
.f6{animation-delay:0.69s}.p6{animation-delay:3.38s}.s6{animation-delay:0.69s}

    @keyframes fall{from{opacity:0;transform:translateY(-70px) rotate(-7deg) scale(.92)}to{opacity:1;transform:none}}
    @keyframes fade{to{opacity:1}}
    @keyframes pulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
    @keyframes press{0%,12%,100%{transform:translateY(0)}5%{transform:translateY(7px)}}
    @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
  </style>

  <rect width="1200" height="330" rx="20" fill="#000"/>
  <rect width="1200" height="330" rx="20" fill="url(#grid)"/>
  <ellipse class="glow" cx="600.0" cy="165.0" rx="560" ry="170" fill="url(#glow)"/>

  <text class="greet" x="600.0" y="96" text-anchor="middle">Hello, I'm</text>
  
  <g transform="translate(126.0,126)">
    <ellipse cx="60" cy="130" rx="48" ry="6" fill="#d8ff58" fill-opacity=".07" filter="url(#blur)" class="shadow s0"/>
